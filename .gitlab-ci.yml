# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.
stages: [test, e2e, build]

test:
  stage: test
  tags: [hugmesh-x86, privileged]
  variables:
    # Branch of hugmesh-admin-bff-api holding the other half of the app-profile schema contract.
    ADMIN_BFF_REF: "main"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    # WHY the checkout stays read-only. These are SHELL-executor runners, so
    # $CI_PROJECT_DIR is a PERSISTENT host directory reused across builds. This
    # container runs as root (node:24-alpine has no USER), and a root container
    # writing straight into that directory leaves root-owned node_modules/ that
    # the runner's own non-root user can no longer clean — wedging every later
    # build. Keeping the checkout `:ro` is therefore worth preserving.
    #
    # WHAT WAS BROKEN. `npm ci` MUST create node_modules/ in its working
    # directory, so mounting the checkout read-only AND working from it
    # (`-w /workspace` over `:ro`) could never install. It dies immediately:
    #     npm error code ENOENT
    #     npm error syscall mkdir
    #     npm error path /workspace/node_modules
    # (verified locally against a real read-only bind mount, as uid 0: exit 254
    # read-only vs exit 0 writable). `npm test` therefore never ran.
    #
    # THE FIX. Keep the checkout read-only at /src, and install into /workspace
    # in the container's OWN writable layer (discarded by --rm). Only the report
    # directories are bind-mounted back out, and they are chown'd to the runner
    # user before exit so nothing root-owned is left in the build dir. The test
    # exit code is propagated, so a real failure still fails the job while its
    # report is still published.
    - rm -rf "${CI_PROJECT_DIR}/test-results" "${CI_PROJECT_DIR}/coverage"
    - mkdir -p "${CI_PROJECT_DIR}/test-results" "${CI_PROJECT_DIR}/coverage"
    # THE CROSS-REPO SCHEMA MIRROR (operator decision 37; issue #3, admin-bff-api#55).
    # schemas/app-profile.schema.json must stay BYTE-IDENTICAL to the BFF's copy, which the
    # BFF validates every app-profile save against. scripts/assert-schema-pin.mjs compares the
    # two FILES, and can only do that if the BFF is readable — so clone it. Its local sha256
    # pin is NOT a substitute: moving the schema and that literal together in one repo keeps
    # both repos green while the files diverge. That was measured (`cmp` -> differ at line 63,
    # both suites green), which is why this clone exists.
    - rm -rf "${CI_PROJECT_DIR}/.schema-sibling"
    - mkdir -p "${CI_PROJECT_DIR}/.schema-sibling"
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 --branch "${ADMIN_BFF_REF}" "${ORG_BASE}/hugmesh-admin-bff-api.git" "${CI_PROJECT_DIR}/.schema-sibling/hugmesh-admin-bff-api"
    # A FAILED CLONE MUST NOT LOOK LIKE A PASS: assert the file by name before the run, and
    # pass HUGMESH_SCHEMA_MIRROR_REQUIRED=1 below so the script ALSO refuses to skip.
    - test -f "${CI_PROJECT_DIR}/.schema-sibling/hugmesh-admin-bff-api/src/main/resources/schema/app-profile.schema.json"
      || { echo "BFF SCHEMA MISSING - the mirror check would SKIP and this job would be green while blind"; exit 1; }
    - >-
      docker run --rm --shm-size=1gb
      -v "${CI_PROJECT_DIR}:/src:ro"
      -v "${CI_PROJECT_DIR}/test-results:/out/test-results"
      -v "${CI_PROJECT_DIR}/coverage:/out/coverage"
      -v "${CI_PROJECT_DIR}/.schema-sibling:/mirror:ro"
      -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
      -e ADMIN_BFF_SCHEMA=/mirror/hugmesh-admin-bff-api/src/main/resources/schema/app-profile.schema.json
      -e HUGMESH_SCHEMA_MIRROR_REQUIRED=1
      -w /workspace node:24-alpine sh -c '
        set -e;
        apk add --no-cache chromium;
        cp -a /src/. /workspace/;
        rm -rf /workspace/node_modules /workspace/test-results /workspace/coverage;
        npm ci;
        set +e;
        CHROME_BIN=/usr/bin/chromium npm test;
        rc=$?;
        mkdir -p /workspace/test-results /workspace/coverage;
        cp -a /workspace/test-results/. /out/test-results/ 2>/dev/null;
        cp -a /workspace/coverage/. /out/coverage/ 2>/dev/null;
        chown -R "$HOST_UID:$HOST_GID" /out;
        exit $rc;
      '
  artifacts:
    # `when: always` is correct ONLY because the report dirs are wiped before
    # the run (above) and repopulated solely from this run's output — so a
    # failed job can never publish a stale green report.
    when: always
    paths:
      - test-results/
      - coverage/
    reports:
      junit: test-results/results.xml
    expire_in: 7 days

# Response-header contract (issue #5). TWO checks that answer different questions and
# are NOT interchangeable:
#   verify:headers — static. Does nginx.conf still SAY the right thing, per BLOCK?
#                    (nginx drops every inherited add_header the moment a location sets
#                    one of its own, so this is a structural question, not a grep.)
#   verify:page    — behavioural. Does the BUILT page still render under those headers
#                    with a clean console and nothing blocked, and are COEP and
#                    Permissions-Policy actually ENFORCED rather than merely present?
# A conf can pass the first and blank the page under the second; that is the whole
# reason both exist. Neither is allow_failure: unlike the pentest DAST stage (whose
# allow_failure is deliberate policy — a FINDING must not red an onboarded repo), these
# assert a contract this repo owns end to end, and a broken one ships a broken console.
# Runs in replay mode: this container has chromium but no docker-in-docker, so the
# script replays the header set parsed out of the real nginx.conf. openssl mints the
# throwaway cert for the cross-origin COEP sentinel (see the script's comment for why
# plain http cannot measure it).
headers:
  stage: test
  needs: []
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    # FIRST: prove nginx will actually ACCEPT this conf. Nothing else here does.
    # `verify:headers` only reads the file, and `verify:page --server=replay` is this
    # repo's own Node re-implementation of the header set — explicitly not nginx. So a
    # conf nginx REFUSES would sail through both, produce a green image (the Dockerfile
    # only COPYs the conf; it never starts the server), and first surface as a
    # crash-looping pod. This runs on the shell runner, which has docker, and pulls the
    # same image the Dockerfile's runtime stage already uses, so it adds no new
    # dependency. `nginx -t` exits 0 on warnings, so this fails only on a real syntax or
    # directive error.
    - >-
      docker run --rm
      -v "${CI_PROJECT_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      nginxinc/nginx-unprivileged:1.27-alpine nginx -t
    # Then the static + browser halves. Same read-only-checkout / writable-workspace
    # shape as the test job above, and for the same reason: this container runs as root
    # and must not leave root-owned files in the shell runner's persistent
    # $CI_PROJECT_DIR.
    - >-
      docker run --rm --shm-size=1gb
      -v "${CI_PROJECT_DIR}:/src:ro"
      -w /workspace node:24-alpine sh -c '
        set -e;
        apk add --no-cache chromium openssl;
        cp -a /src/. /workspace/;
        rm -rf /workspace/node_modules /workspace/test-results /workspace/coverage;
        npm ci;
        npm run verify:headers;
        npm run build:service-catalog;
        CHROME_BIN=/usr/bin/chromium npm run verify:page -- --server=replay;
      '

# Playwright + playwright-bdd e2e harness (e2e/). This job runs the OFFLINE
# contract only — install deps, generate the BDD specs from the .feature files,
# and list every scenario — which proves the Gherkin compiles and every step is
# bound without standing up the cluster. The scenarios themselves are tagged
# `@cluster` and SKIP at runtime unless E2E_CLUSTER=1 (the remote served at a
# baseURL + a reachable admin-bff /bff/superadmin/service-store), so a plain
# `playwright test` here exercises the discovery + skip path. allow_failure so a
# harness hiccup never blocks the image build — the suite ships dark.
e2e:bdd:
  stage: e2e
  needs: []
  allow_failure: true
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    # mcr playwright image carries the browsers; we only need node + npm here.
    - docker run --rm --shm-size=1gb -v "${CI_PROJECT_DIR}/e2e:/work" -w /work
      mcr.microsoft.com/playwright:v1.55.1-noble
      sh -c "npm install --no-audit --no-fund && npx bddgen && npx playwright test --list && npx playwright test"
  artifacts:
    when: always
    paths:
      - e2e/results/
    expire_in: 7 days

build:image:
  # `headers` as well as `test`, and that is load-bearing rather than tidy. With
  # `needs:`, GitLab starts a job the moment its OWN needs are satisfied — it does not
  # wait for its stage's predecessors to finish, and an unrelated red job in an earlier
  # stage does not hold it back. So `needs: [test]` alone meant a RED `headers` job
  # still let this job build and push both `:$TAG` and the moving `:$CI_COMMIT_REF_SLUG`
  # tag the deploy kustomize tracks: pipeline failed, image shipped. That is precisely
  # what the "neither is allow_failure … a broken one ships a broken console" note above
  # promises does not happen, and it matters most for `verify:page`, which is the
  # BEHAVIOURAL half and runs in NO other place — the Dockerfile's `RUN npm run
  # verify:headers` covers only the static half, so a policy that renders the console
  # blank at HTTP 200 had nothing standing between it and the registry.
  needs: [test, headers]
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
