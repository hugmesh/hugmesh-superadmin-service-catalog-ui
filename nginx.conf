# Per-request CSP nonce source. nginx has no built-in random, so we reuse
# $request_id (a 32-hex-char value generated fresh for every request) as the
# nonce. Defined at http scope (this file is included inside the http block via
# conf.d/default.conf) so both the sub_filter rewrite and the CSP header can
# reference the SAME per-response value.
map $request_id $cspnonce {
    default $request_id;
}

server {
    # :8080 to match the federation-api service-catalog module registration
    # remote_entry_url = http://hugmesh-superadmin-service-catalog-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows. Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (consistent with the
    #     CSP frame-ancestors 'none' below) — this remote is loaded by the host
    #     shell via <script> (native federation), NOT via <iframe>, so no framing
    #     is ever required.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    #   - COEP/CORP/Permissions-Policy: the issue-#5 hardening set. Structure ported
    #     from the sibling that already had it — hugmesh-games/frontend/nginx.conf —
    #     but every VALUE re-derived for this console; see the block above `location /`
    #     for the derivation and for the two places that sibling's values are wrong here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
        always;

    # Native-federation remote: CORS is allowed on every bundle this remote serves,
    # so a cross-origin consumer (a dev host on :420x, `ng serve` against a built
    # remote) can fetch remoteEntry.json and the shared/exposed chunks. The DEPLOYED
    # path is not that: the superadmin gateway mounts this console at
    # /superadmin/service-catalog/** on its own origin, so in the cluster the host and
    # this remote are the SAME origin. That distinction is what sets the CORP value
    # below — see the derivation block before `location /`.
    #
    # Content-Security-Policy (strong, nonce-based XSS backstop): there is NO
    # 'unsafe-inline' / 'unsafe-hashes' in script-src — only the per-response
    # nonce. The sub_filter below rewrites every '<script' in index.html to carry
    # nonce="$cspnonce", and es-module-shims auto-propagates that nonce to the
    # module scripts it injects, so native federation keeps working.
    #   - default-src 'self'                       : same-origin default for everything.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only nonce'd same-origin
    #                                                 scripts run; blob: is for
    #                                                 worker/shim-created scripts.
    #   - style-src 'self' 'unsafe-inline' blob:   : Angular sets component styles
    #                                                 inline at runtime, so
    #                                                 'unsafe-inline' is REQUIRED.
    #   - img-src 'self' data: blob: https:        : icons/media incl. data:/blob:.
    #   - font-src 'self' data:                    : webfonts incl. inlined data:.
    #   - connect-src 'self' blob: https: wss:     : BFF/gateway origins are
    #                                                 env-configured, so broad.
    #   - worker-src 'self' blob:                  : module-federation/web workers.
    #   - base-uri 'self'                          : stop <base> tag hijacking.
    #   - object-src 'none'                        : block <object>/<embed>.
    #   - frame-ancestors 'none'                   : no framing (mirrors XFO DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    #
    # ── COEP / CORP / Permissions-Policy (issue #5) ───────────────────────────
    # PORTED FROM: hugmesh-games/frontend/nginx.conf, the one nginx front in this org
    # that already ships all three (its `# ── Hardening (OWASP-recommended response
    # headers)` block). What is ported is the SHAPE: all three at server scope, all
    # `always`, and repeated verbatim in every location that sets an add_header of its
    # own. Two of its VALUES are wrong for this console and are deliberately not copied:
    #
    #   1. Cross-Origin-Resource-Policy — games uses `same-site`; here it is
    #      `same-origin`, and the federation-remote instinct to reach for
    #      `cross-origin` is wrong. THIS CONSOLE IS NEVER FETCHED CROSS-ORIGIN.
    #      Evidence, not assumption:
    #        * the superadmin gateway mounts it at a PATH on its own origin —
    #          hugmesh-generator specs/cluster/apps/22-gateway-superadmin.yaml route
    #          `superadmin-service-catalog-ui`, `path: /superadmin/service-catalog/**`
    #          with `StripPrefix=2` — so every bundle reaches the browser same-origin
    #          with the shell document;
    #        * the host shell REFUSES a cross-origin remoteEntry outright —
    #          hugmesh-host-shell src/app/federation/federation-bootstrap.ts
    #          `isBrowserReachable()` drops any manifest row whose URL is not a
    #          relative path or the page's own origin, which is exactly what the
    #          cluster-shaped `http://hugmesh-superadmin-service-catalog-ui...:8080/
    #          remoteEntry.json` in the registration descriptor is.
    #      `same-origin` also costs the cross-origin case nothing if the topology ever
    #      changes: CORP is only consulted for `no-cors` requests (Fetch, "cross-origin
    #      resource policy check" step 1 returns allowed for any other mode), and every
    #      federation fetch is CORS-mode — `initFederation()` fetches remoteEntry.json
    #      with `fetch()`, and the chunks load as module scripts. The
    #      `Access-Control-Allow-Origin: *` below governs that CORS path and is
    #      untouched; the two headers are orthogonal, not contradictory.
    #      And it is not a new posture, only an explicit one: hugmesh-gateway's
    #      SecurityConfig ALREADY defaults every proxied response to
    #      `CrossOriginResourcePolicy.SAME_ORIGIN`, so that is what the browser has been
    #      receiving for this console all along. Setting it at the origin server means a
    #      direct in-cluster pod hit gets the same policy as a hit through the edge.
    #   2. Permissions-Policy — games grants `autoplay=(self)`, `fullscreen=(self)`,
    #      `gamepad=(self)` for its WASM titles and denies three feature names Chrome
    #      no longer recognises. This console has NO camera/mic/geolocation/fullscreen/
    #      WebAuthn/clipboard code path at all (grepped across src/app, excluding the
    #      generated src/app/api client), so every feature takes the EMPTY allowlist
    #      `()`, which denies every origin including self.
    #      MEASURED, not assumed: driving Chrome 149 with the games list produced
    #      `Error with Permissions-Policy header: Unrecognized feature:` warnings for
    #      `ambient-light-sensor`, `battery` and `document-domain` (and `bluetooth`,
    #      `speaker-selection`, `web-share` were checked and rejected too). Those are
    #      dropped here; `hid`, `idle-detection`, `publickey-credentials-create` and
    #      `serial` — recognised, and postdating that sibling — are added. All 23 names
    #      below were confirmed present in `document.featurePolicy.features()`, so this
    #      header adds no console noise. Console noise is not cosmetic: a console that
    #      always has warnings in it is a console nobody reads.
    #      This header also OVERRIDES a looser one: hugmesh-gateway sets a platform-wide
    #      Permissions-Policy granting `camera=(self)`, `microphone=(self)`,
    #      `autoplay=(self)`, `fullscreen=(self)` for the Matrix call feature. Spring's
    #      StaticServerHttpHeadersWriter only writes when the header is ABSENT
    #      (`writeHttpHeaders` -> `HttpHeaders.containsHeader` -> skip; verified in the
    #      bytecode of spring-security-web 7.0.6, and the same mechanism the gateway's
    #      fallback CSP relies on), so this console's stricter set is the one that ships
    #      and the gateway's grants never reach it.
    #
    #   - Cross-Origin-Embedder-Policy: require-corp
    #       Safe here BECAUSE every subresource is same-origin: the CORP check exempts
    #       same-origin responses, so require-corp starves nothing this page loads. The
    #       artefact was inspected rather than assumed — the built page pulls only its
    #       own hashed .js/.css plus favicon.ico, `src/assets/` is EMPTY, there is no
    #       <img>/<iframe>/<embed>/<object>/<video>/<audio>, no webfont and no external
    #       stylesheet, and every BFF call is a same-origin relative request
    #       (ApiConfiguration.rootUrl defaults to '', src/app/api/api-configuration.ts).
    #       What it buys is future-proofing: a cross-origin subresource added later has
    #       to be opted in explicitly instead of loading silently.
    #       COOP is deliberately NOT part of this change — issue #5 asks for these three,
    #       and COEP enforces the subresource opt-in on its own (cross-origin ISOLATION
    #       would need COOP too, but nothing here uses SharedArrayBuffer).
    #       COOP is also already supplied at the edge (gateway SecurityConfig sets
    #       `CrossOriginOpenerPolicy.SAME_ORIGIN`), which is why COEP is the half that
    #       had to be added here: the same SecurityConfig declines COEP platform-wide on
    #       purpose — "would break module-federation remote loading until the remotes are
    #       CORP-tagged" — and that reasoning is exactly why it belongs per-remote, on a
    #       remote whose subresources are all same-origin, rather than at the gateway.
    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags.
        #   - sub_filter_types text/html : ONLY rewrite HTML; JS/CSS bundles are
        #                                  left byte-for-byte untouched.
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';
        #
        # src/index.html carries ngCspNonce="__HUG_CSP_NONCE__" on the root element,
        # which is what makes @angular/build take its CSP-SAFE critical-CSS path. The
        # build then stamps that same marker into a nonce="…" attribute on every
        # <script>/<style> it emits, and these two filters resolve it:
        #
        #   1. STRIP the build-time nonce attribute. REMOVE, not rewrite: the filter
        #      above has already prepended the real nonce, so rewriting would leave TWO
        #      nonce attributes on the tag — and a duplicate-attribute parse error makes
        #      CSP treat the element as "Not Nonceable" (CSP3, "is element nonceable",
        #      step 3), i.e. the nonce stops counting even though it is correct. The
        #      <style> the critical-CSS pass emits loses its nonce here and is covered
        #      by style-src's 'unsafe-inline' instead, which is already required for
        #      Angular's runtime component styles.
        #   2. Resolve the marker on the ROOT ELEMENT (a different attribute name, so
        #      filter 1 cannot match it — there is no space before "nonce" in
        #      "ngcspnonce") to the real per-response nonce, so the nonce Angular stamps
        #      on its runtime-injected styles and the nonce in this response's CSP
        #      header are ONE value.
        sub_filter ' nonce="__HUG_CSP_NONCE__"' '';
        sub_filter 'ngcspnonce="__HUG_CSP_NONCE__"' 'ngcspnonce="$cspnonce"';

        add_header Access-Control-Allow-Origin "*" always;
        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
            always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        # Same values as `location /`: the probe is same-origin plaintext to kubelet and
        # embeds nothing, so nothing here wants a looser policy than the document's.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
            always;
    }
}
