<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HugMesh Superadmin Service Catalog (remote)</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="description" content="HugMesh Superadmin Service Catalog — the superadmin control plane for curating which services each domain is offered, managing deploy templates, and recording the deployment lifecycle." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body>
  <!-- ngCspNonce is REQUIRED, not decoration: @angular/build only takes its
       CSP-safe critical-CSS path when this attribute is present. Without it the
       build defers the stylesheet with an inline event handler, which our
       nonce-based script-src blocks outright (nonces do not apply to event
       handlers) — measured: the stylesheet then stayed at media="print" and
       never applied. The value is a marker the nginx sub_filter rewrites to the
       same per-request $cspnonce that goes into the CSP header, so Angular's
       runtime style nonce and the header nonce are ONE value. See nginx.conf. -->
  <hug-service-catalog-root ngCspNonce="__HUG_CSP_NONCE__"></hug-service-catalog-root>
</body>
</html>
