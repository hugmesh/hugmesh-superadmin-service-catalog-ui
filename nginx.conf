server {
    # :8080 to match the federation-api appstore module registration
    # remote_entry_url = http://snapdragon-superadmin-appstore-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Native-federation remote: the snapdragon.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
